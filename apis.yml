name: Doccla
description: >-
  Doccla is a UK-founded virtual care platform delivering remote patient monitoring and
  virtual wards across Europe. It combines pre-configured, Bluetooth-connected medical
  devices, a patient app, and a clinician dashboard to monitor patients at home, reducing
  hospital admissions and freeing bed capacity for health systems. The platform integrates
  bidirectionally with electronic health record (EHR) systems, including Oracle Cerner for
  the Northwest London Virtual Hospital, and is deployed with NHS trusts and European
  providers. Doccla holds ISO 27001 and ISO 13485 certifications, UKCA and CE medical-device
  marks, is GDPR compliant, and is registered with the UK Care Quality Commission (CQC).
  No public developer API or portal is published at this time; integration is delivered via
  managed EHR and medical-device connections.
